// CS Retro play.sh — F-key test bindings (renderer A/B, weapons, session).
// Installed every launch as cstrike/csretro_play_test.cfg via userconfig.
// Not a product default. Re-exec mid-session: exec csretro_play_test.cfg
//
// ┌──── Session ──────────────────────────────────────────────────────────┐
// │ F1  max money (impulse 101)                                           │
// │ F2  god                                                               │
// │ F3  noclip                                                            │
// │ F4  print this legend                                                 │
// ├──── Renderer A/B (#12 / #14 / #15) ───────────────────────────────────┤
// │ F5  r_csretro_renderer 0  (Xash / Mode 0)                             │
// │ F6  r_csretro_renderer 1  (offscreen probe)                           │
// │ F7  r_csretro_renderer 2  (takeover)                                  │
// │ F8  screenshot (same pose: F5→F8 then F7→F8)                          │
// ├──── Weapons (DoD parity pack) ────────────────────────────────────────┤
// │ F9  Glock18 + ammo                                                    │
// │ F10 AK47 + ammo                                                       │
// │ F11 Knife + HE + Smoke + Flash + Fire grenades                        │
// ├──── Diagnose ─────────────────────────────────────────────────────────┤
// │ KP_MINUS  toggle cl_showfps                                           │
// │ KP_PLUS   dump OFF (play-safe)                                        │
// │ KP_ENTER  dump ON  (Cert only — extremes Lag erwartet)                │
// │ F12       engine snapshot (nicht überschreiben)                       │
// └───────────────────────────────────────────────────────────────────────┘

sv_cheats 1

// --- aliases (echo so the log shows what you pressed) ---
alias csretro_help "echo === CSRETRO_PLAY_TEST ===; echo F1 money F2 god F3 noclip F4 help; echo F5 mode0 F6 mode1 F7 mode2 F8 screenshot; echo F9 glock F10 ak47 F11 knife+nades; echo KP- fps KP+ dumpOFF KP_ENTER dumpON; echo NOW: nothing required — #15+#HE-smoke evidence enough; optional F8 catch flashes in mode2"

alias csretro_money "impulse 101; echo CSRETRO_TEST money=max"

alias csretro_mode0 "r_csretro_renderer 0; echo CSRETRO_TEST renderer=0 (Xash)"
alias csretro_mode1 "r_csretro_renderer 1; echo CSRETRO_TEST renderer=1 (offscreen)"
alias csretro_mode2 "r_csretro_renderer 2; echo CSRETRO_TEST renderer=2 (takeover)"

alias csretro_shot "screenshot; echo CSRETRO_TEST screenshot"

alias csretro_glock "give weapon_glock18; echo CSRETRO_TEST give=glock18"
alias csretro_ak47 "give weapon_ak47; echo CSRETRO_TEST give=ak47"
alias csretro_nades "csretro_test_nades; echo CSRETRO_TEST nades=team-aware"

alias csretro_fps "toggle cl_showfps; echo CSRETRO_TEST toggle cl_showfps"
# Dump = Cert-Hotpath (ReadPixels/pixelproof) — für Play IMMER aus.
# KP+: force OFF. KP_ENTER: kurz ON (nur Diagnose, erwartet extremes Lag).
alias csretro_dump_off "r_csretro_offscreen_dump 0; echo CSRETRO_TEST dump=0 (play)"
alias csretro_dump_on "r_csretro_offscreen_dump 1; echo CSRETRO_TEST dump=1 WARNING lag — KP+ to disable"

// --- binds ---
bind "F1" "csretro_money"
bind "F2" "god"
bind "F3" "noclip"
bind "F4" "csretro_help"

bind "F5" "csretro_mode0"
bind "F6" "csretro_mode1"
bind "F7" "csretro_mode2"
bind "F8" "csretro_shot"

bind "F9" "csretro_glock"
bind "F10" "csretro_ak47"
bind "F11" "csretro_nades"

bind "KP_MINUS" "csretro_fps"
bind "KP_PLUS" "csretro_dump_off"
bind "KP_ENTER" "csretro_dump_on"

echo CSRETRO_PLAY_TEST_CLIENT loaded — F4 for legend
csretro_help
