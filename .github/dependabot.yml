version: 2
updates:
  # Action versions under .github/ only. No vendored-tree or vcpkg PRs.
  # One grouped PR per week instead of one branch per Action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
