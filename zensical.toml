# Human docs site. Source of truth remains docs/de and docs/en (AGENTS.md / plan §11).
# Built by CI with the pinned Zensical wheel; never edit the published Page by hand.

[project]
site_name = "CSRETRO"
site_description = "Counter-Strike 1.6 client and AMXX API. The client is not playable yet."
site_author = "CSRETRO"
site_url = "https://benjarogit.github.io/csretro/"
repo_url = "https://github.com/benjarogit/csretro"
repo_name = "benjarogit/csretro"
docs_dir = "docs"
site_dir = "site"
copyright = "CSRETRO – see CREDITS.md and SECURITY.md"

# Authoritative plan stays in-repo; the Page links to GitHub for it (relative
# links into the repo root break the strict site build). Assets stay published.
exclude_docs = """
plan/**
"""

nav = [
  { "Home" = "index.md" },
  { "Deutsch" = [
    { "Start" = "de/index.md" },
    { "Spieler" = [
      { "Einstieg" = "de/players/index.md" },
      { "Funktionen" = "de/players/features.md" },
      { "Einstellungen und Befehle" = "de/players/settings.md" },
      { "Spielinhalte" = "de/client/install.md" },
      { "Erster Start" = "de/client/first-start.md" },
    ] },
    { "Mitentwickler" = [
      { "Einstieg" = "de/maintainers/index.md" },
      { "Lokale Koordination" = "de/maintainers/chatdev.md" },
      { "Werkzeugbewertung" = "de/maintainers/chatdev-evaluation.md" },
      { "Laufzeit-Abnahme" = "de/maintainers/runtime-readiness.md" },
      { "Build-Voraussetzungen" = "de/build/prerequisites.md" },
      { "Client bauen" = "de/build/client.md" },
      { "Server-API bauen" = "de/build/server.md" },
      { "Laufzeit und Integration" = "de/client/runtime.md" },
      { "Surface" = "de/client/xash-surface.md" },
      { "Host" = "de/client/xash-host.md" },
      { "Launcher" = "de/client/xash-launcher.md" },
      { "Identität" = "de/client/player-identity.md" },
    ] },
    { "Plugin-Autoren" = "de/plugins/index.md" },
    { "Serverbetreiber" = [
      { "Einstieg" = "de/server/index.md" },
      { "Testserver" = "de/server/testserver.md" },
    ] },
  ] },
  { "English" = [
    { "Home" = "en/index.md" },
    { "Players" = [
      { "Getting started" = "en/players/index.md" },
      { "Features" = "en/players/features.md" },
      { "Settings and commands" = "en/players/settings.md" },
      { "Game content" = "en/client/install.md" },
      { "First start" = "en/client/first-start.md" },
    ] },
    { "Contributors" = [
      { "Getting started" = "en/maintainers/index.md" },
      { "Local coordination" = "en/maintainers/chatdev.md" },
      { "Tool evaluation" = "en/maintainers/chatdev-evaluation.md" },
      { "Runtime acceptance" = "en/maintainers/runtime-readiness.md" },
      { "Build prerequisites" = "en/build/prerequisites.md" },
      { "Build client" = "en/build/client.md" },
      { "Build server API" = "en/build/server.md" },
      { "Runtime and integration" = "en/client/runtime.md" },
      { "Surface" = "en/client/xash-surface.md" },
      { "Host" = "en/client/xash-host.md" },
      { "Launcher" = "en/client/xash-launcher.md" },
      { "Identity" = "en/client/player-identity.md" },
    ] },
    { "Plugin authors" = "en/plugins/index.md" },
    { "Server operators" = [
      { "Getting started" = "en/server/index.md" },
      { "Test server" = "en/server/testserver.md" },
    ] },
  ] },
]

[project.theme]
language = "en"
features = [
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "content.code.copy",
]
icon.repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/benjarogit/csretro"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
