// CS Retro play.sh — listen-server rules for renderer/weapon A/B testing.
// Installed every launch as cstrike/listenserver.cfg. Not a product default.
hostname "CS Retro"
sv_lan 1
sv_cheats 1
bot_enable 0
bot_quota 0
mp_autoteambalance 0
mp_limitteams 0
mp_timelimit 0
mp_winlimit 0
mp_maxrounds 0
mp_roundtime 9
mp_freezetime 0
mp_buytime -1
mp_buy_anywhere 1
mp_round_infinite 1
mp_startmoney 16000
mp_maxmoney 16000
mp_c4timer 35
mp_friendlyfire 0
mp_flashlight 1
allow_spectators 1
echo CSRETRO_PLAY_TEST_RULES
