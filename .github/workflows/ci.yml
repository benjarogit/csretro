name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Run 43095634906 still holds ci-${{ github.ref }}. GitHub lists that run as
# queued and refuses to cancel it because no job was ever assigned. A new
# group lets the next push start. cancel-in-progress stays on for this group.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: repository verification
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The verification job reads pointers and gitlinks only. Pulling 130 MB
          # of LFS assets and the vcpkg submodule would add minutes for no gain.
          # Build jobs fetch what they need in G04.
          lfs: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck gcc binutils cmake ninja-build

      - name: Verify
        run: ./scripts/verify.sh

      - name: Test native game-client export screen
        run: python3 -m unittest discover -s tests/game_client -v

      - name: Test manual original-content selection
        run: python3 -m unittest discover -s tests/install_content -p 'test_manual_source.py' -v

      - name: Test client build profiles and assembler ABI
        run: python3 -m unittest discover -s tests/build_scripts -v
