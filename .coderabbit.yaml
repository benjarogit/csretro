# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: true
  auto_approvals:
    enabled: true
    approve_on_skipped_review: false
    allow_author_approval: false
  pre_merge_checks:
    override_requested_reviewers_only: true
    custom_checks:
      - name: CSRETRO independent acceptance
        mode: error
        instructions: >-
          Independently assess source content at the exact PR head against the
          current docs/evidence/acceptance.json. This manifest describes this PR,
          not permanent baseline criteria; a docs-only canary legitimately has
          different scope from the infrastructure PR. Global mandatory checks
          must remain unchanged and are verified by Actions/native protection.
          Review every changed current/old path and each criterion's substantive
          requirement. Missing required human evidence or unverifiable source
          requirements are failures/inconclusive, never guessed passes.
          The checks array names evidence handles for the later live API audit;
          do NOT require live GitHub API access, completion of your own review,
          a prior CodeRabbit approval or the protected merge acceptance job.
          Those are independently enforced AFTER this source-content assessment,
          otherwise the protocol is circular. Do not submit a GitHub review from
          this custom check: return your assessment in its Explanation.
          If and only if the source criteria genuinely pass, return PASS and put
          a visible fenced csretro-acceptance-review JSON block in Explanation.
          Include schema=1, head=the exact head SHA, acceptance_sha256=SHA256 of
          Python json.dumps(artifact,sort_keys=True,separators=(',',':')) UTF-8,
          decision=pass, reviewed_paths=every changed current/old path,
          summary=concrete independent assessment, criteria=[{id:each criterion ID,
          passed:true,reason:concrete inspected evidence}]. The authenticated
          walkthrough check result is the publication channel. Never fabricate
          a pass, execution result or human acceptance. The coordinator separately
          requires a completed substantive CodeRabbit run, actual current-head
          native approval and all live CI/security checks before any merge.
  fail_commit_status: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**/*"
      instructions: >-
        Enforce AGENTS.md and the authoritative CSRETRO plan. Check acceptance
        evidence, DE/EN documentation, preserved work and security boundaries.
        A stored callback is not gameplay proof. Do not approve unresolved findings.
        Acceptance uses the committed per-PR docs/evidence/acceptance.json.
        The custom pre-merge check evaluates source semantics and publishes its
        assessment in Explanation; it does not require its own completed review
        or live checks. Formal approval and real CI/security completion are
        separately required by native protection and the host verifier.
