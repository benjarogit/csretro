name: CodeQL Python tooling
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 6 * * 1'

permissions:
  contents: read

jobs:
  codeql-python:
    name: codeql-python
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
